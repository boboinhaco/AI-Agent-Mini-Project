<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .steps .step.warn { color: #f0c674; font-weight: 600; font-size: 13px; }
  .steps .step.warn::before { content: "⚠️ "; }
  .steps .step.warn.done::before { content: "⚠️ "; }
  .bubble .status {
    display: inline-block; margin-bottom: 8px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: #3a3a52; color: #c3c3e0;
  }
  .bubble .status.validating { background: #2b3a52; color: #9ecbff; }
  .bubble .status.rejected { background: #4a3a1a; color: #f0c674; }
  .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    max-width: 70%; margin-top: -4px; background: #17171f; border: 1px solid #3a3a52;
    border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary {
    cursor: pointer; padding: 7px 12px; color: #8b8bd8; user-select: none;
    list-style: none;
  }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "🔍 "; }
  .prompt-box[open] summary::before { content: "🔽 "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid #3a3a52;
    background: #11111a; color: #c3c3e0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 320px; overflow-y: auto;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }
  .approval {
    max-width: 70%; background: #2a2316; border: 1px solid #a07a2a; border-radius: 12px;
    padding: 12px 14px; font-size: 13px; line-height: 1.5;
  }
  .approval h4 { margin: 0 0 6px; font-size: 13px; color: #f0c674; }
  .approval ul { margin: 4px 0 10px 18px; padding: 0; }
  .approval .btns { display: flex; gap: 8px; }
  .approval .btns button { padding: 7px 14px; font-size: 13px; }
  .approval .btns .reject { background: #6b3a3a; }
  .approval.decided { opacity: 0.6; }
  .memo { max-width: 70%; font-size: 12px; color: #7fb3a6; padding: 2px 14px; }
</style>
</head>
<body>
<div id="app">
  <header>운영 인시던트 대응 에이전트 <span>{{ backendLabel }}</span></header>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step" :class="{ done: step.done, warn: step.warn }">{{ step.text }}</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble"><div v-if="item.status" class="status" :class="item.statusKind">{{ item.status }}</div>{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'approval'" class="approval" :class="{ decided: item.decision }">
        <h4>⚠️ 운영자 승인 필요 — 초안에 위험 조치가 포함돼 있습니다</h4>
        <ul><li v-for="a in item.actions" :key="a">{{ a }}</li></ul>
        <div v-if="!item.decision" class="btns">
          <button @click="decide(item, true)">승인하고 계속</button>
          <button class="reject" @click="decide(item, false)">거절 (조치 제외하고 재작성)</button>
        </div>
        <div v-else>→ {{ item.decision === 'approved' ? '승인됨' : '거절됨 — 재작성 중' }}</div>
      </div>

      <div v-else-if="item.kind === 'memo'" class="memo">{{ item.text }}</div>

      <div v-else-if="item.kind === 'report'" class="memo">
        📄 인시던트 리포트 #{{ item.incidentId }} 저장됨 — <a :href="'/incidents/' + item.incidentId + '?format=md'" target="_blank" style="color:#8b8bd8">열기</a>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <input
      v-model="input"
      autocomplete="off"
      placeholder="예: auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요"
    />
    <button type="submit" :disabled="sending">보내기</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

const STEP_LABELS = {
  ResearchDispatched: e => `조사 서브에이전트 분배: 메트릭 ${e.sub_agents.metrics} · 로그 ${e.sub_agents.logs} · 런북 ${e.sub_agents.runbook}`,
  SubAgent: e => e.status === 'started' ? `${e.agent} 시작 (${(e.targets || []).join(', ')})` : null,
  LogsCollected: e => `최근 로그 수집 (시스템: ${e.target}, ${e.lines}줄)`,
  ResearchMerged: e => `조사 결과 병합 (${e.elapsed}s, 병렬)`,
  ApprovalGranted: () => '운영자 승인 → 검수 진행',
  ApprovalRejected: () => '운영자 거절 → 조치 제외하고 재작성',
  ApprovalEscalated: () => '거절 상한 도달 → 조치 실행 금지 경고를 달아 검수로 진행',
  ApprovalSkipped: e => e.reason === '위험 조치 없음' ? '위험 조치 없음 — 승인 생략' : null,
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  SystemDiscovery: e => `시스템명이 없어 전체 ${e.targets.length}개 시스템을 탐색`,
  SystemsScreened: e => `증상(${e.incident_type})과 맞는 시스템 선별: ${e.kept.join(', ')}${e.dropped.length ? ` (${e.dropped.length}개 제외)` : ''}`,
  DraftWritten: e => `답변 초안 작성 완료 (시도 ${e.attempt}) → 검수 중`,
  Validation: e => e.verdict.startsWith('합격') ? '검수 통과'
      : { text: `검수 반려 (시도 ${e.attempt}) → 다시 작성 중: ${(e.reasons || []).join(' ')}`, warn: true },
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backendLabel = ref('all_total_vue');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `${h.llm_backend} 실모델(${h.fast_llm}/${h.quality_llm}) · all_total_vue`;
    }).catch(() => {});

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      consume(url, stepsItem);
    }

    // 승인/거절 버튼 → 같은 run을 이어서 스트리밍 (HITL resume)
    let pendingBubble = null;   // 승인 대기 중인 답변 말풍선 — 재개 후에도 같은 말풍선을 이어 쓴다

    function decide(item, approved) {
      item.decision = approved ? 'approved' : 'rejected';
      sending.value = true;
      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      consume(`/chat/approve/stream?thread_id=${encodeURIComponent(thread)}&approved=${approved}`, stepsItem, pendingBubble);
      pendingBubble = null;
    }

    function approvedLabel(url) { return url.includes('approved=true') ? '✅ 승인됨 → 검수 중…' : '↩️ 거절됨 → 다시 작성 중'; }

    function consume(url, stepsItem, reuseBubble = null) {
      const es = new EventSource(url);
      let streamItem = reuseBubble;
      if (streamItem) { streamItem.status = approvedLabel(url); streamItem.statusKind = 'validating'; }
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'ApprovalRequired') {
          stepsItem.steps.forEach(s => s.done = true);
          log.value.push({ id: nextId++, kind: 'approval', actions: e.actions, decision: null });
          if (streamItem) { streamItem.status = '⏸ 운영자 승인 대기'; streamItem.statusKind = 'rejected'; }
          pendingBubble = streamItem;
          streamItem = null; streamAttempt = null;
          scrollToBottom();
          return;
        }
        if (e.type === 'MemoryCompacted') {
          log.value.push({ id: nextId++, kind: 'memo',
            text: `🧠 대화가 길어져 과거 ${e.summarized}개 메시지를 요약(${e.summary_chars}자)으로 압축했습니다` });
          scrollToBottom();
          return;
        }

        if (e.type === 'AnswerToken') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '', status: null, statusKind: '' });
            log.value.push(streamItem);
          }
          if (streamAttempt !== e.attempt) {   // 재작성 — 새 말풍선 대신 같은 말풍선의 내용을 교체
            streamItem.text = '';
            streamAttempt = e.attempt;
            streamItem.status = e.attempt > 1 ? `✍️ 다시 작성 중 (시도 ${e.attempt})` : '✍️ 작성 중';
            streamItem.statusKind = '';
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }
        if (e.type === 'DraftWritten' && streamItem) {
          streamItem.status = '🔍 검수 중…'; streamItem.statusKind = 'validating';
        }
        if (e.type === 'Validation' && streamItem) {
          if (e.verdict.startsWith('합격')) { streamItem.status = null; }
          else { streamItem.status = `⚠️ 검수 반려 — 다시 작성합니다 (${(e.reasons || [])[0] || ''})`; streamItem.statusKind = 'rejected'; }
        }

        if (e.type === 'FinalAnswer') {
          stepsItem.steps.forEach(s => s.done = true);   // 모든 단계 완료 표시
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          streamItem.status = null;
          // 승인 카드·재작성 단계가 말풍선 뒤에 쌓였으면 최종 답변을 맨 아래로 옮긴다 (답변은 항상 하나, 항상 마지막)
          const at = log.value.indexOf(streamItem);
          if (at >= 0 && at !== log.value.length - 1) { log.value.splice(at, 1); log.value.push(streamItem); }
          if (e.incident_id) log.value.push({ id: nextId++, kind: 'report', incidentId: e.incident_id });
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        const item = typeof label === 'string' ? { text: label, warn: false } : label;
        stepsItem.steps.forEach(s => s.done = true);   // 새 단계가 오면 이전 단계는 끝난 것
        stepsItem.steps.push(reactive({ ...item, done: false }));
        scrollToBottom();
      };

      es.onerror = () => { es.close(); sending.value = false; };
    }

    return { backendLabel, log, input, sending, logEl, onSubmit, decide };
  },
}).mount('#app');
</script>
</body>
</html>
